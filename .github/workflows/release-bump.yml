name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      existing_tag:
        description: Existing release to retry (empty creates the next version)
        type: string
        default: ""
      publish:
        description: Publish after verification (false validates without creating a version)
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Keep the release draft until all native image gates pass.
  bump-release:
    if: inputs.publish && inputs.existing_tag == ''
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@ff61364bb99093f43f0c02b2f5091f0e22ba9fb6
    with:
      bump: ${{ github.event.inputs.bump }}
      draft: true
    secrets: inherit

  release:
    needs: bump-release
    if: ${{ always() && !cancelled() && (needs.bump-release.result == 'success' || needs.bump-release.result == 'skipped') }}
    uses: uug-ai/workflows/.github/workflows/release-create.yml@ff61364bb99093f43f0c02b2f5091f0e22ba9fb6
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ inputs.existing_tag || needs.bump-release.outputs.tag }}
      docker_context: "."
      hardened: true
      publish: ${{ inputs.publish }}
      finalize_release: true
      use_private_module_auth: false
      smoke_queue: kcloud-loitering-queue.fifo
      worker_additional_smoke: true
      create_gitops_pr: ${{ inputs.publish }}
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-22.04"},
          {"architecture":"arm64","runner":"ubuntu-22.04-arm"}
        ]
      gitops_key: kerberoshub.services.loitering.tag
    secrets: inherit
