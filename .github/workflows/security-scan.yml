name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  hardened-image:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@2f0e9c2719522b008f3fdd53d8bfb6019a3b1e04
    with:
      # MongoDB 8 cannot start on Linux 6.19+ runner kernels (SERVER-121912).
      smoke_mongodb_image: mongo:7
      hardened: true
      publish: false
      use_private_module_auth: false
      smoke_queue: kcloud-loitering-queue.fifo
      worker_additional_smoke: true
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-22.04"},
          {"architecture":"arm64","runner":"ubuntu-22.04-arm"}
        ]
