name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  hardened-image:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@f987049597f729e1ca3ca801f6fdedc2b1b06917
    with:
      hardened: true
      publish: false
      use_private_module_auth: false
      smoke_queue: kcloud-loitering-queue.fifo
      worker_additional_smoke: true
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]

  native-inventory:
    needs: hardened-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hardened-image-*
          path: native-evidence
      - name: Require complete installed-package scanner and SPDX closure
        run: |
          bash image/verify-inventory.sh native-evidence/hardened-image-amd64
          bash image/verify-inventory.sh native-evidence/hardened-image-arm64
          bash image/test-native-owners.sh native-evidence/hardened-image-amd64/runtime-evidence ownership-negative-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-inventory-closure
          path: native-evidence/**/closure-*
