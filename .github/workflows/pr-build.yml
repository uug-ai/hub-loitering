name: Build pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    uses: uug-ai/workflows/.github/workflows/pr-build.yml@f987049597f729e1ca3ca801f6fdedc2b1b06917
    with:
      project: ${{ github.event.repository.name }}
      go_version: "1.26.10"
      go_dir: "."
      go_sum_path: "go.sum"
      docker_context: "."
      use_private_module_auth: false
      use_buildkit_secrets: true
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]'
    secrets: inherit
