name: Build pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    uses: uug-ai/workflows/.github/workflows/pr-build.yml@2f0e9c2719522b008f3fdd53d8bfb6019a3b1e04
    with:
      project: ${{ github.event.repository.name }}
      go_version: "1.26.11"
      go_dir: "."
      go_sum_path: "go.sum"
      docker_context: "."
      use_private_module_auth: false
      use_buildkit_secrets: true
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-22.04"},{"architecture":"arm64","runner":"ubuntu-22.04-arm"}]'
    secrets: inherit
